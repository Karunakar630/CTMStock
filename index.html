<!DOCTYPE html>
<html>
<head>
  <title>PC Form App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>📦 PC Form Entry</h2>

<div class="container">

  <input type="text" id="name" placeholder="Name">
  <input type="text" id="ctm" placeholder="CTM No">

  <select id="paid">
    <option value="Yes">Paid</option>
    <option value="No">Not Paid</option>
  </select>

  <select id="cardReceived">
    <option value="Yes">Card Received</option>
    <option value="No">Not Received</option>
  </select>

  <select id="cardDelivered">
    <option value="Yes">Delivered</option>
    <option value="No">Not Delivered</option>
  </select>

  <input type="file" id="photo" accept="image/*">

  <button onclick="submitForm()">Submit</button>

  <h3>Entries</h3>
  <div id="list"></div>

</div>

<script src="script.js"></script>
</body>
</html>
